naftiko: 1.0.0-alpha2
info:
  label: Moov API — Authentication
  description: 'Moov API — Authentication. 2 operations. Lead operation: Revoke an access token. Self-contained Naftiko capability
    covering one Moov business surface.'
  tags:
  - Moov
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MOOV_API_KEY: MOOV_API_KEY
capability:
  consumes:
  - type: http
    namespace: moov-authentication
    baseUri: https://api.moov.io
    description: Moov API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: oauth2-revoke
      path: /oauth2/revoke
      operations:
      - name: revokeaccesstoken
        method: POST
        description: Revoke an access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: oauth2-token
      path: /oauth2/token
      operations:
      - name: createaccesstoken
        method: POST
        description: Create an access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MOOV_API_KEY}}'
  exposes:
  - type: rest
    namespace: moov-authentication-rest
    port: 8080
    description: REST adapter for Moov API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/oauth2/revoke
      name: oauth2-revoke
      description: REST surface for oauth2-revoke.
      operations:
      - method: POST
        name: revokeaccesstoken
        description: Revoke an access token
        call: moov-authentication.revokeaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/oauth2/token
      name: oauth2-token
      description: REST surface for oauth2-token.
      operations:
      - method: POST
        name: createaccesstoken
        description: Create an access token
        call: moov-authentication.createaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: moov-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Moov API — Authentication. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: revoke-access-token
      description: Revoke an access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: moov-authentication.revokeaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: create-access-token
      description: Create an access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: moov-authentication.createaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
