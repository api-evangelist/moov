naftiko: 1.0.0-alpha2
info:
  label: Moov API — Accounts
  description: 'Moov API — Accounts. 8 operations. Lead operation: Create an account. Self-contained Naftiko capability covering
    one Moov business surface.'
  tags:
  - Moov
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MOOV_API_KEY: MOOV_API_KEY
capability:
  consumes:
  - type: http
    namespace: moov-accounts
    baseUri: https://api.moov.io
    description: Moov API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: createaccount
        method: POST
        description: Create an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listaccounts
        method: GET
        description: List accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter accounts by display name.
        - name: email
          in: query
          type: string
          description: Filter accounts by email address.
        - name: type
          in: query
          type: string
          description: Filter by account type (individual or business).
    - name: accounts-accountID
      path: /accounts/{accountID}
      operations:
      - name: getaccount
        method: GET
        description: Retrieve an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateaccount
        method: PATCH
        description: Update an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteaccount
        method: DELETE
        description: Delete an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-accountID-connected-accounts
      path: /accounts/{accountID}/connected-accounts
      operations:
      - name: listconnectedaccounts
        method: GET
        description: List connected accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-accountID-connections
      path: /accounts/{accountID}/connections
      operations:
      - name: shareaccountconnection
        method: POST
        description: Share an account connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tos-token
      path: /tos-token
      operations:
      - name: generatetostoken
        method: GET
        description: Generate a terms of service token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MOOV_API_KEY}}'
  exposes:
  - type: rest
    namespace: moov-accounts-rest
    port: 8080
    description: REST adapter for Moov API — Accounts. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: POST
        name: createaccount
        description: Create an account
        call: moov-accounts.createaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listaccounts
        description: List accounts
        call: moov-accounts.listaccounts
        with:
          name: rest.name
          email: rest.email
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountid}
      name: accounts-accountid
      description: REST surface for accounts-accountID.
      operations:
      - method: GET
        name: getaccount
        description: Retrieve an account
        call: moov-accounts.getaccount
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateaccount
        description: Update an account
        call: moov-accounts.updateaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteaccount
        description: Delete an account
        call: moov-accounts.deleteaccount
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountid}/connected-accounts
      name: accounts-accountid-connected-accounts
      description: REST surface for accounts-accountID-connected-accounts.
      operations:
      - method: GET
        name: listconnectedaccounts
        description: List connected accounts
        call: moov-accounts.listconnectedaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountid}/connections
      name: accounts-accountid-connections
      description: REST surface for accounts-accountID-connections.
      operations:
      - method: POST
        name: shareaccountconnection
        description: Share an account connection
        call: moov-accounts.shareaccountconnection
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tos-token
      name: tos-token
      description: REST surface for tos-token.
      operations:
      - method: GET
        name: generatetostoken
        description: Generate a terms of service token
        call: moov-accounts.generatetostoken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: moov-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Moov API — Accounts. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-account
      description: Create an account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: moov-accounts.createaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-accounts
      description: List accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: moov-accounts.listaccounts
      with:
        name: tools.name
        email: tools.email
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-account
      description: Retrieve an account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: moov-accounts.getaccount
      outputParameters:
      - type: object
        mapping: $.
    - name: update-account
      description: Update an account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: moov-accounts.updateaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-account
      description: Delete an account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: moov-accounts.deleteaccount
      outputParameters:
      - type: object
        mapping: $.
    - name: list-connected-accounts
      description: List connected accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: moov-accounts.listconnectedaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: share-account-connection
      description: Share an account connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: moov-accounts.shareaccountconnection
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: generate-terms-service-token
      description: Generate a terms of service token
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: moov-accounts.generatetostoken
      outputParameters:
      - type: object
        mapping: $.
