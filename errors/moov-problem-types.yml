problems:
- status: 201
  title: Created
  area: Transfers
  description: Transfer was successfully created but an error occurred while getting the synchronous response. The
    asynchronous response object will be returned.
  remediation: Moov's internal services are in a degraded state and are unable to return the full transfer object
    as a response. The transfer was created but we aren't able to generate a synchronous response, so we return
    the async response here. You can attempt GET the transfer using the ID that's returned. Note that if Moov's
    services are still degraded, you will not be able to get the response if you attempted to use the transfer `GET`
    [endpoint](/api/money-movement/transfers/get/) right after creating the transfer.
- status: 202
  title: Accepted
  area: Transfers
  description: A transfer or refund was successfully created but a timeout occurred while waiting for a synchronous
    response. Rail-specific details may be missing from the response object.
  remediation: A timeout occurred with the payment network. To retrieve full rail-specific details at a later time,
    use the transfer GET endpoint.
- status: 400
  title: Bad request
  area: Transfers
  description: Invalid request, an error message will be available in the response body.
  remediation: There was a problem with the request payload. The error message will provide specific details on
    what needs to be fixed.
- status: 409
  title: Conflict
  area: Transfers
  description: Attempted to create a transfer using duplicate X-Idempotency-Key header
  remediation: Retry the request with a different X-Idempotency-Key header.
- status: 422
  title: Unprocessable content
  area: Transfers
  description: The request body could not be processed
  remediation: The error message will let you know how long to wait (in milliseconds) before you can retry
- status: 429
  title: Too many requests
  area: Transfers
  description: Request was refused due to rate limiting
  remediation: The error message will let you know how long to wait (in milliseconds) before you can retry
