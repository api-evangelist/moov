specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Moov
providerId: moov
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Payments
description: Moov REST API rate limits per facilitator account.
sources:
  - https://moov.io/pricing
  - https://docs.moov.io/api/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: REST API (default)
    scope: facilitator
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
  - name: Transfer creation
    scope: facilitator
    metric: transfers_per_minute
    limit: tier-based
