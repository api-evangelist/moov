aid: moov
url: https://raw.githubusercontent.com/api-evangelist/moov/refs/heads/main/apis.yml
modified: '2026-03-21'
apis:
  - aid: moov:moov-api
    name: Moov API
    tags:
      - Payments
      - Money Movement
      - Financial Infrastructure
      - Transfers
      - Banking
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.moov.io
    humanURL: https://docs.moov.io/api/
    properties:
      - url: https://docs.moov.io/api/
        type: Documentation
      - url: openapi/moov-api-openapi.yml
        type: OpenAPI
      - url: asyncapi/moov-webhooks-asyncapi.yml
        type: AsyncAPI
    description: >-
      The Moov API is a RESTful financial infrastructure platform that enables
      developers to integrate money movement capabilities into their applications.
      The API supports a full range of financial operations including account
      management, payment method onboarding, transfers, sweeps, refunds, dispute
      resolution, card issuing, and payment links. It provides capabilities for
      accepting payments, storing funds in digital wallets, sending money between
      accounts, and issuing cards for spend management. Authentication uses OAuth2
      access tokens with permission scopes, and the API returns JSON responses
      using standard HTTP response codes.

  - aid: moov:moov-js
    name: Moov.js
    tags:
      - JavaScript
      - Client SDK
      - Payments
      - Data Collection
      - PCI Compliance
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.moov.io
    humanURL: https://docs.moov.io/moovjs/
    properties:
      - url: https://docs.moov.io/moovjs/
        type: Documentation
    description: >-
      Moov.js is a client-side JavaScript SDK designed to streamline interactions
      with the Moov API while keeping personally identifiable information out of
      developer infrastructure. All PII is transmitted directly to Moov, relieving
      developers of the responsibility for storing or handling sensitive user data.
      The SDK supports account creation and management, funding source integration
      including bank accounts and cards, financial institution lookup via routing
      numbers, profile enrichment, and transfer facilitation. It uses OAuth2 access
      tokens with scopes to control what actions accounts can perform, and provides
      access to pre-built UI components called Moov Drops.

  - aid: moov:moov-drops
    name: Moov Drops
    tags:
      - UI Components
      - Web Components
      - Payments
      - Frontend
      - Embedded Finance
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.moov.io
    humanURL: https://docs.moov.io/guides/developer-tools/
    properties:
      - url: https://docs.moov.io/guides/developer-tools/
        type: Documentation
    description: >-
      Moov Drops are pre-built, drop-in web UI components for complicated payment
      and account management flows. These components securely collect payment and
      account information from users without developers needing to build complex
      financial forms from scratch. Drops handle sensitive data collection in a
      compliant manner, integrating with the Moov API and Moov.js to provide a
      cohesive front-end experience. They are designed to accelerate the development
      of financial applications by providing ready-to-use components for onboarding,
      bank account linking, card collection, and other payment-related workflows.

  - aid: moov:moov-sdks
    name: Moov Backend SDKs
    tags:
      - SDK
      - Go
      - TypeScript
      - Python
      - Java
      - PHP
      - Ruby
      - .NET
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.moov.io
    humanURL: https://docs.moov.io/sdks/
    properties:
      - url: https://docs.moov.io/sdks/
        type: Documentation
    description: >-
      Moov provides official server-side client libraries for interacting with the
      Moov API across multiple programming languages, including Go, TypeScript,
      Python, Java, PHP, Ruby, and C#/.NET. These SDKs abstract the HTTP layer and
      provide idiomatic interfaces for each language to access Moov's full range of
      financial operations. Each SDK is actively maintained and versioned to track
      the Moov API's versioning scheme. Developers can use these libraries to
      integrate money movement, account management, payment processing, and card
      issuing capabilities into backend services and applications.

common:
  - type: JSONSchema
    url: json-schema/moov-account-schema.json
  - type: JSONSchema
    url: json-schema/moov-transfer-schema.json
  - type: JSON-LD
    url: json-ld/moov-context.jsonld
