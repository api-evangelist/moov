apis:
- aid: moov:moov-js
  name: Moov.js
  description: Moov.js is a client-side JavaScript SDK designed to streamline interactions with the Moov
    API while keeping personally identifiable information out of developer infrastructure. All PII is
    transmitted directly to Moov, relieving developers of the responsibility for storing or handling sensitive
    user data. The SDK supports account creation, funding source integration, and transfer facilitation,
    along with pre-built UI components called Moov Drops.
  humanURL: https://docs.moov.io/moovjs/
  tags:
  - Client SDK
  - Data Collection
  - JavaScript
  - Payments
  - PCI Compliance
  properties:
  - type: Documentation
    url: https://docs.moov.io/moovjs/
- aid: moov:moov-drops
  name: Moov Drops
  description: Moov Drops are pre-built, drop-in web UI components for complicated payment and account
    management flows. These components securely collect payment and account information from users without
    developers needing to build complex financial forms from scratch. Drops integrate with the Moov API
    and Moov.js to provide a cohesive front-end experience for onboarding, bank account linking, card
    collection, and other payment-related workflows.
  humanURL: https://docs.moov.io/guides/developer-tools/
  tags:
  - Embedded Finance
  - Frontend
  - Payments
  - UI Components
  - Web Components
  properties:
  - type: Documentation
    url: https://docs.moov.io/guides/developer-tools/
- aid: moov:moov-backend-sdks
  name: Moov Backend SDKs
  description: Moov provides official server-side client libraries for interacting with the Moov API across
    multiple programming languages, including Go, TypeScript, Python, Java, PHP, Ruby, and C#/.NET. These
    SDKs abstract the HTTP layer and provide idiomatic interfaces for each language to access Moov's full
    range of financial operations. Each SDK is actively maintained and versioned to track the Moov API's
    versioning scheme.
  humanURL: https://docs.moov.io/sdks/
  tags:
  - .NET
  - Go
  - Java
  - PHP
  - Python
  - Ruby
  - SDK
  - TypeScript
  properties:
  - type: Documentation
    url: https://docs.moov.io/sdks/
