name: Moov
description: Moov is a financial infrastructure platform that enables developers to embed money movement
  capabilities directly into their applications. Their developer platform provides a RESTful API, client-side
  JavaScript SDK, pre-built UI components, and official backend SDKs across multiple languages for building
  compliant, full-featured financial products.
