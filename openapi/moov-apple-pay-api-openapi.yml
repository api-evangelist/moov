  /accounts/{accountID}/apple-pay/tokens:
    post:
      operationId: linkApplePayToken
      description: 'Connect an Apple Pay token to the specified account.


        Read our Apple Pay tutorial to learn more.

        The `token` data is defined by Apple Pay and should be passed through from Apple Pay''s response unmodified.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        description: ID of the Moov account representing the cardholder.
        schema:
          type: string
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedApplePayPaymentMethod'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
