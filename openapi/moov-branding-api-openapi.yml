components:
  schemas:
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    BrandColorValidationError:
      type: object
      properties:
        accent:
          type: string
    ColorsValidationError:
      type: object
      properties:
        light:
          $ref: '#/components/schemas/BrandColorValidationError'
        dark:
          $ref: '#/components/schemas/BrandColorValidationError'
    BrandColors:
      type: object
      required:
      - dark
      - light
      properties:
        dark:
          $ref: '#/components/schemas/BrandColor'
        light:
          $ref: '#/components/schemas/BrandColor'
      description: Brand colors for light and dark modes.
    BrandProperties:
      type: object
      required:
      - colors
      properties:
        colors:
          $ref: '#/components/schemas/BrandColors'
    BrandColor:
      type: object
      required:
      - accent
      properties:
        accent:
          $ref: '#/components/schemas/AccentColor'
    BrandValidationError:
      type: object
      properties:
        colors:
          $ref: '#/components/schemas/ColorsValidationError'
    AccentColor:
      type: string
      description: A CSS hex color representing an accent color.
      example: '#111111'
  parameters:
    VersionHeader:
      name: X-Moov-Version
      in: header
      required: false
      description: 'Set this header to v2026.01.00 to use the API described in this specification.

        When omitted, the server defaults to v2024.01.00, the earliest supported version, which may not match the behavior documented here.

        An unrecognized well-formed version uses the latest supported version that is not newer than the requested version, when one exists.

        For example, `v2026.08.00` uses `v2026.07.00`.

        A malformed value, such as `2022`, returns a `404` response.'
      schema:
        type: string
        enum:
        - v2026.01.00
        example: v2026.01.00
        x-speakeasy-ignore: true
      x-speakeasy-ignore: true
