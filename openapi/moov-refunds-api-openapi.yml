openapi: 3.2.0
info:
  title: Moov Refunds API
  description: The Moov API lets software platforms accept, store, send, and spend money through a single REST API.
  version: v2026.04.00
  contact:
    name: Moov
    url: https://moov.io
  termsOfService: https://moov.io/legal/platform-agreement/
servers:
- url: https://api.moov.io
  description: Moov production
security:
- bearerAuth: []
tags:
- name: Refunds
  description: Refunds and reversals on card transfers.
paths:
  /accounts/{accountID}/transfers/{transferID}/refunds:
    parameters:
    - $ref: '#/components/parameters/accountID'
    - $ref: '#/components/parameters/transferID'
    post:
      operationId: createRefund
      tags:
      - Refunds
      summary: Create a refund
      responses:
        '200':
          description: The created refund.
    get:
      operationId: listRefunds
      tags:
      - Refunds
      summary: List refunds
      responses:
        '200':
          description: A list of refunds.
  /accounts/{accountID}/transfers/{transferID}/refunds/{refundID}:
    parameters:
    - $ref: '#/components/parameters/accountID'
    - $ref: '#/components/parameters/transferID'
    - name: refundID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getRefund
      tags:
      - Refunds
      summary: Retrieve a refund
      responses:
        '200':
          description: The refund.
  /accounts/{accountID}/transfers/{transferID}/reversals:
    parameters:
    - $ref: '#/components/parameters/accountID'
    - $ref: '#/components/parameters/transferID'
    post:
      operationId: createReversal
      tags:
      - Refunds
      summary: Cancel or refund a card transfer (reversal)
      responses:
        '200':
          description: The reversal.
components:
  parameters:
    transferID:
      name: transferID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    accountID:
      name: accountID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The Moov account identifier.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 access token passed as a Bearer token.
externalDocs:
  description: Moov API reference and canonical OpenAPI spec
  url: https://docs.moov.io/api/
