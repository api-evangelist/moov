components:
  schemas:
    CapabilityRequirement:
      type: object
      properties:
        currentlyDue:
          type: array
          items:
            $ref: '#/components/schemas/RequirementID'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RequirementError'
      description: Represents individual and business data necessary to facilitate the enabling of a capability for an account.
    CapabilityID:
      type: string
      enum:
      - transfers
      - send-funds
      - send-funds.push-to-card
      - money-transfer.push-to-card
      - send-funds.ach
      - send-funds.rtp
      - send-funds.instant-bank
      - collect-funds
      - collect-funds.card-payments
      - money-transfer.pull-from-card
      - collect-funds.ach
      - wallet
      - wallet.balance
      - card-issuing
      - issuing.cardholder
      - production-app
      - platform.production-app
      - platform.wallet-transfers
      description: 'Moov account capabilities.


        **Deprecated capabilities**


        The `send-funds`, `collect-funds`, and `wallet` capability IDs are deprecated. Request granular capabilities instead (for example, `send-funds.ach`, `collect-funds.card-payments`, or `wallet.balance`). Deprecated values will be removed in a future API version.


        Read our [capabilities reference](https://docs.moov.io/guides/accounts/capabilities/reference/) to choose the right capabilities for your integration.


        The `production-app`, `platform.production-app`, and / or `platform.wallet-transfers` capabilities might appear in the list for your Partner account. These are read-only capabilities that Moov requests. These capabilities remain active with your account and require no additional action.'
