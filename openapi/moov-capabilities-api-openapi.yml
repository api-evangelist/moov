        capability:
          $ref: '#/components/schemas/CapabilityID'
        accountID:
          type: string
        status:
          $ref: '#/components/schemas/CapabilityStatus'
        requirements:
          $ref: '#/components/schemas/CapabilityRequirement'
        disabledReason:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        disabledOn:
          type: string
          format: date-time
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AddCapabilitiesError:
      type: object
      properties:
        error:
          type: string
        capabilities:
