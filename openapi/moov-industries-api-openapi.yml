openapi: 3.2.0
info:
  title: Moov Industries API
  version: v2026.01.00
  contact:
    name: Moov Developer Support
    email: help@moov.io
    url: https://moov.io
  license:
    name: Unlicensed
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: 'Operations tagged Industries across 2 of this provider''s published API definitions: moov-api-v2026.01.00-openapi.yml, moov-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moov.io
  description: Production API host
  variables: {}
security:
- BasicAuth: []
tags:
- name: Industries
paths:
  /industries:
    get:
      operationId: listIndustries
      description: 'Returns a list of industries relevant to merchant profile enrichment. Results are ordered by industry name.


        To access this endpoint using an access token,

        you''ll need to specify the `/profile-enrichment.read` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedIndustries'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Industries
      x-speakeasy-name-override: list
      summary: List industries
      x-summary-source: derived
    servers:
    - url: https://api.moov.io
      description: Production API host
      variables: {}
components:
  schemas:
    EnrichedIndustries:
      type: object
      required:
      - industries
      properties:
        industries:
          type: array
          items:
            $ref: '#/components/schemas/IndustryTaxonomy'
    IndustryTaxonomy:
      type: object
      required:
      - industry
      - displayName
      - category
      - categoryDisplayName
      - defaultMcc
      properties:
        industry:
          type: string
          description: Classification identifier for the industry.
          example: clothing-accessories
        displayName:
          type: string
          description: Display name of the industry
          example: Clothing & Accessories
        category:
          type: string
          description: Category slug
          example: retail
        categoryDisplayName:
          type: string
          description: Human-readable category label
          example: Retail
        defaultMcc:
          type: string
          maxLength: 4
          description: Default Merchant Category Code
          example: '5651'
      description: A structured industry taxonomy entry with category and mapped to a default MCC code.
  parameters:
    VersionHeader:
      name: X-Moov-Version
      in: header
      required: false
      description: 'Set this header to v2026.01.00 to use the API described in this specification.

        When omitted, the server defaults to v2024.01.00, the earliest supported version, which may not match the behavior documented here.

        An unrecognized well-formed version uses the latest supported version that is not newer than the requested version, when one exists.

        For example, `v2026.08.00` uses `v2026.07.00`.

        A malformed value, such as `2022`, returns a `404` response.'
      schema:
        type: string
        enum:
        - v2026.01.00
        example: v2026.01.00
        x-speakeasy-ignore: true
      x-speakeasy-ignore: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
externalDocs:
  url: https://docs.moov.io/
  description: Moov Guides and API Documentation
x-refined-from:
- moov-api-v2026.01.00-openapi.yml
- moov-openapi.yml
