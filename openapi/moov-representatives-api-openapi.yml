    patch:
      operationId: updateRepresentative
      description: 'If a representative''s information has changed you can patch the information associated with a specific representative ID.

        Read our business representatives guide to learn more.


        When **can** profile data be updated:


        - For unverified representatives, all profile data can be edited.

        - During the verification process, missing or incomplete profile data can be edited.

        - Verified representatives can only add missing profile data.


        When **can''t** profile data be updated:


        - Verified representatives cannot change any existing profile data.


        If you need to update information in a locked state, please contact Moov support.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/representatives.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        description: ID of the account.
        schema:
          type: string
      - name: representativeID
        in: path
