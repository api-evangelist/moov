components:
  schemas:
    PhoneNumberError:
      type: object
      properties:
        number:
          type: string
        countryCode:
          type: string
    Address:
      type: object
      required:
      - addressLine1
      - city
      - stateOrProvince
      - postalCode
      - country
      properties:
        addressLine1:
          type: string
          maxLength: 60
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: 123 Main Street
        addressLine2:
          type: string
          maxLength: 32
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: Apt 302
        city:
          type: string
          maxLength: 32
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: Boulder
        stateOrProvince:
          type: string
          maxLength: 2
          example: CO
        postalCode:
          type: string
          maxLength: 5
          example: '80301'
        country:
          type: string
          maxLength: 2
          example: US
    PhoneNumber:
      type: object
      properties:
        number:
          type: string
          maxLength: 10
          example: '8185551212'
        countryCode:
          type: string
          maxLength: 1
          example: '1'
    Email:
      type: string
      maxLength: 255
      format: email
      example: jordan.lee@classbooker.dev
    BirthDate:
      type: object
      required:
      - day
      - month
      - year
      properties:
        day:
          type: integer
          example: 9
        month:
          type: integer
          example: 11
        year:
          type: integer
          example: 1989
    BirthDateUpdate:
      type: object
      properties:
        day:
          type: integer
          example: 9
        month:
          type: integer
          example: 11
        year:
          type: integer
          example: 1989
    IndividualNameUpdate:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's first given name.
          example: Jordan
        middleName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's second given name, if any.
          example: Reese
        lastName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's family name.
          example: Lee
        suffix:
          type: string
          maxLength: 20
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: Suffix of a given name.
          example: Jr
    RepresentativeValidationError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            name:
              $ref: '#/components/schemas/IndividualNameError'
            phone:
              $ref: '#/components/schemas/PhoneNumberError'
            email:
              type: string
            address:
              $ref: '#/components/schemas/AddressError'
            birthDate:
              $ref: '#/components/schemas/BirthDateValidationError'
            governmentID:
              $ref: '#/components/schemas/GovernmentIDError'
            responsibilities:
              $ref: '#/components/schemas/RepresentativeResponsibilitiesError'
    CreateRepresentative:
      type: object
      properties:
        birthDate:
          $ref: '#/components/schemas/BirthDate'
        governmentID:
          $ref: '#/components/schemas/GovernmentID'
        responsibilities:
          $ref: '#/components/schemas/RepresentativeResponsibilities'
      allOf:
      - type: object
        required:
        - name
        properties:
          name:
            $ref: '#/components/schemas/IndividualName'
          phone:
            $ref: '#/components/schemas/PhoneNumber'
          email:
            $ref: '#/components/schemas/Email'
          address:
            $ref: '#/components/schemas/Address'
        description: The template for omitting properties.
      description: Describes a business representative to create.
    GovernmentID:
      type: object
      properties:
        ssn:
          type: object
          properties:
            full:
              type: string
              pattern: ^\d{3}[-]?\d{2}[-]?\d{4}$
            lastFour:
              type: string
        itin:
          type: object
          properties:
            full:
              type: string
              pattern: ^\d{3}[-]?\d{2}[-]?\d{4}$
            lastFour:
              type: string
    IndividualNameError:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        suffix:
          type: string
    Representative:
      type: object
      required:
      - representativeID
      - name
      - createdOn
      - updatedOn
      properties:
        representativeID:
          type: string
          description: Unique identifier for this representative.
        name:
          $ref: '#/components/schemas/IndividualName'
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        email:
          $ref: '#/components/schemas/Email'
        address:
          $ref: '#/components/schemas/Address'
        birthDateProvided:
          type: boolean
          description: Indicates whether this representative's birth date has been provided.
        governmentIDProvided:
          type: boolean
          description: Indicates whether a government ID (SSN, ITIN, etc.) has been provided for this representative.
        responsibilities:
          $ref: '#/components/schemas/RepresentativeResponsibilities'
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        disabledOn:
          type: string
          format: date-time
      description: Describes a business representative.
    BirthDateValidationError:
      type: object
      properties:
        day:
          type: string
        month:
          type: string
        year:
          type: string
    AddressError:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        stateOrProvince:
          type: string
        postalCode:
          type: string
        country:
          type: string
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AddressUpdate:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 60
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: 123 Main Street
        addressLine2:
          type: string
          maxLength: 32
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: Apt 302
        city:
          type: string
          maxLength: 32
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: Boulder
        stateOrProvince:
          type: string
          maxLength: 2
          example: CO
        postalCode:
          type: string
          maxLength: 5
          example: '80301'
        country:
          type: string
          maxLength: 2
          example: US
    IndividualName:
      type: object
      required:
      - firstName
      - lastName
      properties:
        firstName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's first given name.
          example: Jordan
        middleName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's second given name, if any.
          example: Reese
        lastName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's family name.
          example: Lee
        suffix:
          type: string
          maxLength: 20
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: Suffix of a given name.
          example: Jr
    UpdateRepresentative:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/IndividualNameUpdate'
        phone:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/PhoneNumber'
        email:
          type:
          - string
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Email'
        address:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/AddressUpdate'
        birthDate:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/BirthDateUpdate'
        governmentID:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/GovernmentID'
        responsibilities:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/RepresentativeResponsibilities'
    GovernmentIDError:
      type: object
      properties:
        ssn:
          type: object
          properties:
            full:
              type: string
            lastFour:
              type: string
        itin:
          type: object
          properties:
            full:
              type: string
            lastFour:
              type: string
    RepresentativeResponsibilities:
      type: object
      properties:
        isController:
          type: boolean
          description: Indicates whether this individual has significant management responsibilities within the business.
        isOwner:
          type: boolean
          description: 'If `true`, this field indicates that the individual has a business ownership stake of at least 25% in the

            business. If the representative does not own at least 25% of the business, this field should be `false`.'
        ownershipPercentage:
          type: integer
          description: The percentage of ownership this individual has in the business (required if `isOwner` is `true`).
          example: 38
        jobTitle:
          type: string
          maxLength: 64
          pattern: '[a-zA-Z0-9,.\/?:''"|~!@#$%^&*()+_= -]+'
          example: CEO
      description: Describes the job responsibilities of a business representative.
    RepresentativeResponsibilitiesError:
      type: object
      properties:
        isController:
          type: string
        isOwner:
          type: string
        ownershipPercentage:
          type: string
        jobTitle:
          type: string
  parameters:
    VersionHeader:
      name: X-Moov-Version
      in: header
