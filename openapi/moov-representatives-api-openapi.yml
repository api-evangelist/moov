              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Representatives
      x-speakeasy-name-override: delete
      security:
      - BasicAuth: []
      summary: Delete representative
      x-summary-source: derived
    get:
      operationId: getRepresentative
      description: 'Retrieve a specific representative associated with a given Moov account. Read our business representatives guide to learn more.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/representatives.read` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
