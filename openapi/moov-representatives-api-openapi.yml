openapi: 3.2.0
info:
  title: Moov Representatives API
  version: '1.0'
  description: 'Operations tagged Representatives across 3 of this provider''s published API definitions: moov-api-v2026.01.00-openapi.yml, moov-openapi.yml, moov-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moov.io
  description: Production API host
  variables: {}
tags:
- name: Representatives
paths:
  /accounts/{accountID}/representatives:
    post:
      operationId: createRepresentative
      description: 'Moov accounts associated with businesses require information regarding individuals who represent the business.

        You can provide this information by creating a representative. Each account is allowed a maximum of 7 representatives.

        Read our business representatives guide to learn more.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/representatives.write` scope.'
