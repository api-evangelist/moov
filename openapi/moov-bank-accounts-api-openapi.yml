      x-speakeasy-name-override: getVerification
      security:
      - BasicAuth: []
      summary: Get bank account verification
      x-summary-source: derived
    post:
      operationId: initiateBankAccountVerification
      description: 'Instant micro-deposit verification offers a quick and efficient way to verify bank account ownership.


        Send a $0.01 credit with a unique verification code via RTP, FedNow, or same-day ACH, depending on the receiving bank''s capabilities. This

        feature provides a faster alternative to traditional methods, allowing verification in a single session.


        It is recommended to use the `X-Wait-For: rail-response` header to synchronously receive the outcome of the instant credit in the

        response payload.


        Possible verification methods:

        - `instant`: Real-time verification credit sent via RTP or FedNow

        - `ach`: Verification credit sent via same-day ACH


        Possible statuses:

        - `new`: Verification initiated, credit pending

        - `sent-credit`: Credit sent, available for verification in the external bank account

        - `failed`: Verification failed due to credit rejection/return, details in `exceptionDetails`


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/bank-accounts.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: x-wait-for
        in: header
        required: false
        description: 'Optional header to wait for certain events, such as the rail response, to occur before returning a response.


          When this header is set to `rail-response`, the endpoint will wait for a sent-credit or failed status from the payment rail.'
        schema:
          $ref: '#/components/schemas/BankAccountWaitFor'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      - name: bankAccountID
        in: path
        required: true
        schema:
          type: string
      responses:
