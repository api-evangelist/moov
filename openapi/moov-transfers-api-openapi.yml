openapi: 3.2.0
info:
  title: Moov Transfers API
  version: '1.0'
  description: 'Operations tagged Transfers across 3 of this provider''s published API definitions: moov-api-v2026.01.00-openapi.yml, moov-openapi.yml, moov-openapi.yml. Each path carries the servers of the definition it was published in.'
