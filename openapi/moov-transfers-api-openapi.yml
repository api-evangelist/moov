components:
  schemas:
    TransferOptionsValidationError:
      type: object
      properties:
        amount:
          type: string
        source:
          type: string
        destination:
          type: string
    TransferWaitFor:
      type: string
      enum:
      - rail-response
    AchDebitFundTransferPaymentMethod:
      type: object
      required:
      - paymentMethodID
      - paymentMethodType
      - bankAccount
      properties:
        paymentMethodID:
          $ref: '#/components/schemas/TransferPaymentMethodID'
        paymentMethodType:
          type: string
          enum:
          - ach-debit-fund
        bankAccount:
          $ref: '#/components/schemas/TransferPaymentMethodsBankAccount'
      title: ACH debit fund
    RefundValidationError:
      type: object
      properties:
        amount:
          type: string
        error:
          type: string
          description: Used for generic errors when invalid request data isn't attributed to a single request field.
    CardExpiration:
      type: object
      required:
      - month
      - year
      properties:
        month:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-digit month the card expires.
        year:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-digit year the card expires.
      description: The expiration date of the card or token.
      example:
        month: '01'
        year: '21'
    CreateTransferOptions:
      type: object
      required:
      - source
      - destination
      - amount
      properties:
        source:
          $ref: '#/components/schemas/SourceDestinationOptions'
        destination:
          $ref: '#/components/schemas/SourceDestinationOptions'
        amount:
          $ref: '#/components/schemas/Amount'
    CardID:
      type: string
      description: ID of the card.
      example: 01234567-89ab-cdef-0123-456789abcdef
    FacilitatorFee:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Total facilitator fee.
        totalDecimal:
          type: string
          pattern: ^\d+\.\d{1,9}$
          description: 'Same as `total`, but a decimal-formatted numerical string that represents up to 9 decimal place precision.


            Only either `total` or `totalDecimal` can be set. Set this field if you expect the fee to be in fractions of a cent.'
          example: '12.987654321'
        markup:
          type: integer
          format: int64
          description: Markup facilitator fee.
        markupDecimal:
          type: string
          pattern: ^\d+\.\d{1,9}$
          description: 'Same as `markup`, but a decimal-formatted numerical string that represents up to 9 decimal place precision.

            Only either `markup` or `markupDecimal` can be set. Set this field if you expect the fee to be in fractions of a cent.'
          example: '0.987654321'
      description: Total or markup fee.
    CardPresentPaymentTransferPaymentMethod:
      type: object
      required:
      - paymentMethodID
      - paymentMethodType
      properties:
        paymentMethodID:
          $ref: '#/components/schemas/TransferPaymentMethodID'
        paymentMethodType:
          type: string
          enum:
          - card-present-payment
        terminalCard:
          $ref: '#/components/schemas/TransferTerminalCard'
      description: A card used at point of sale terminal for a card present transaction as contained within a payment method.
    RTPTransactionDetails:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RTPTransactionStatus'
        networkResponseCode:
          type: string
          description: Response code returned by network on failure.
        failureCode:
          $ref: '#/components/schemas/RTPFailureCode'
        initiatedOn:
          type: string
          format: date-time
        completedOn:
          type: string
          format: date-time
        failedOn:
          type: string
          format: date-time
        acceptedWithoutPostingOn:
          type: string
          format: date-time
