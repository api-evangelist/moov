        For these transfers, a successful cancellation reduces `capturableAmount` without changing `authorizedAmount`.

        For these transfers, a partial cancellation leaves the remaining `capturableAmount` available for capture.

        To access this endpoint using a token you''ll need

        to specify the `/accounts/{accountID}/transfers.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        description: The partner's Moov account ID.
        schema:
          type: string
      - name: transferID
        in: path
        required: true
        description: The transfer ID to cancel.
        schema:
          type: string
