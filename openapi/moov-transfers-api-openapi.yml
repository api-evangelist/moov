        in: header
        required: true
        description: Prevents duplicate reversals from being created.
        schema:
          type: string
      - name: accountID
        in: path
        required: true
        description: The Moov account ID.
        schema:
          type: string
      - name: transferID
        in: path
        required: true
        description: The transfer ID to reverse.
        schema:
          type: string
