components:
  schemas:
    CreateWebhookValidationError:
      type: object
      properties:
        url:
          type: string
          description: Details about the URL validation error.
        status:
          type: string
          description: Details about the status validation error.
        eventTypes:
          type: string
          description: Details about the event types validation error.
        description:
          type: string
          description: Details about the description validation error.
    WebhookSecret:
      type: object
      required:
      - secret
      properties:
        secret:
          type: string
          description: The secret key used to sign webhook payloads. Use this to verify the authenticity of incoming webhooks.
      description: The secret used to verify webhook payloads.
    UpdateWebhookValidationError:
      type: object
      properties:
        url:
          type: string
          description: Details about the URL validation error.
        status:
          type: string
          description: Details about the status validation error.
        eventTypes:
          type: string
          description: Details about the event types validation error.
        description:
          type: string
          description: Details about the description validation error.
    UpdateWebhook:
      type: object
      required:
      - url
      - status
      - eventTypes
      - description
      properties:
        url:
          type: string
          format: uri
          description: The URL where webhook events will be sent.
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookStatus'
          description: The status of the webhook.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: The list of event types this webhook should subscribe to.
        description:
          type: string
          description: A description of the webhook for reference. Can be an empty string.
      description: Request body for updating an existing webhook.
    PingResponse:
      type: object
      required:
      - webhook
      - requestBodySent
      - responseStatusCode
      properties:
        webhook:
          allOf:
          - $ref: '#/components/schemas/Webhook'
          description: The webhook that was pinged.
        requestBodySent:
          type: object
          additionalProperties: {}
          description: The request body sent to the target URL. It will contain an event type of `event.test` and an empty (null) data payload.
        responseStatusCode:
          type: integer
          format: int32
          description: The response status code after sending a ping event to the URL.
      description: Response from pinging a webhook.
    Webhook:
      type: object
      required:
      - webhookID
      - url
      - status
      - eventTypes
      - description
      - createdOn
      - updatedOn
      properties:
        webhookID:
          type: string
          description: Unique identifier for the webhook.
        url:
          type: string
          format: uri
          description: The URL where webhook events will be sent.
        status:
          $ref: '#/components/schemas/WebhookStatus'
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: The list of event types this webhook is subscribed to.
        description:
          type: string
          description: A description of the webhook for reference.
        createdOn:
          type: string
          format: date-time
          description: Timestamp of when the webhook was created.
        updatedOn:
          type: string
          format: date-time
          description: Timestamp of when the webhook was last updated.
        lastUsedOn:
          type: string
          format: date-time
          description: Timestamp of when the webhook last received an event.
      description: A configured webhook endpoint that receives event notifications.
    WebhookStatus:
      type: string
      enum:
      - enabled
      - disabled
      description: The status of a webhook.
    WebhookEventType:
      type: string
      enum:
      - '*'
      - account.created
      - account.updated
      - account.disconnected
      - balance.updated
      - bankAccount.created
      - bankAccount.updated
      - bankAccount.deleted
      - cancellation.created
      - cancellation.updated
      - card.autoUpdated
      - capability.requested
      - capability.updated
      - dispute.created
      - dispute.updated
      - invoice.created
      - invoice.updated
      - networkID.updated
      - paymentMethod.enabled
      - paymentMethod.disabled
      - refund.created
      - refund.updated
      - representative.created
      - representative.updated
      - representative.deleted
      - sweep.created
      - sweep.updated
      - terminalApplication.created
      - terminalApplication.updated
      - ticket.created
      - ticket.updated
      - ticket.messageAdded
      - transfer.created
      - transfer.updated
      - wallet.created
      - wallet.updated
      - walletTransaction.updated
      - billingStatement.created
      - authorization.expiring
      - event.test
      description: The type of event that occurred.
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CreateWebhook:
      type: object
      required:
      - url
      - status
      - eventTypes
      - description
      properties:
        url:
          type: string
          format: uri
          description: The URL where webhook events will be sent.
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookStatus'
          description: The status of the webhook.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: The list of event types this webhook should subscribe to.
        description:
          type: string
          description: A description of the webhook for reference. Can be an empty string.
      description: Request body for creating a new webhook.
    EventType:
      type: object
      required:
      - eventTypeID
      - type
      - description
      properties:
        eventTypeID:
          type: string
          description: Unique identifier for the event type.
        type:
          type: string
          description: The type identifier string.
        description:
          type: string
          description: A human-readable description of the event type.
      description: Describes an available event type that can be subscribed to.
