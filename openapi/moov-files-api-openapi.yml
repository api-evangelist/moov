      description: Production API host
      variables: {}
components:
  schemas:
    FileUploadRequestMultiPart:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The file to upload. Valid types are `csv`, `png`, `jpeg`, `pdf`.
        filePurpose:
          $ref: '#/components/schemas/FilePurpose'
        metadata:
          allOf:
          - $ref: '#/components/schemas/FileUploadMetadata'
          description: Additional metadata to be stored with the file.
      required:
      - file
      - filePurpose
    FileValidationError:
      type: object
      properties:
        error:
          type: string
        file:
          type: string
        FileName:
          type: string
        filePurpose:
          type: string
        metadata:
          type: string
    FileUploadMetadata:
      type: object
      properties:
        representative_id:
          type: string
          format: ID
          description: The representative ID that the file is for. Required when filePurpose is `representativeVerification`.
        comment:
          type: string
          description: Comments or notes about the file.
      description: Additional metadata to be stored with the file.
    FilePurpose:
      type: string
      enum:
      - business_verification
      - representative_verification
      - individual_verification
      - merchant_underwriting
      - account_requirement
      - identity_verification
      description: The purpose of the file being uploaded.
      example: representative_verification
    FileStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      description: The file's status.
      example: pending
    FileDetails:
      type: object
      required:
      - fileID
      - fileName
      - accountID
      - filePurpose
      - fileStatus
      - metadata
      - fileSizeBytes
      - createdOn
      - updatedOn
      properties:
        fileID:
          type: string
        fileName:
          type: string
          maxLength: 64
          example: logo.png
        accountID:
          type: string
        filePurpose:
          $ref: '#/components/schemas/FilePurpose'
        fileStatus:
          $ref: '#/components/schemas/FileStatus'
        metadata:
          type: string
          format: json
          example: '{"error_code": "document-name-mismatch", "requirement_id": "document.individual.verification", "representative_id": "c63ab175-251d-497e-a267-7346d087e180", "comment": "testing comment"'
        decisionReason:
          type: string
          example: not correct file
        fileSizeBytes:
          type: integer
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
      description: Describes a file linked to a Moov account.
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
  parameters:
    VersionHeader:
      name: X-Moov-Version
      in: header
      required: false
      description: 'Set this header to v2026.01.00 to use the API described in this specification.

        When omitted, the server defaults to v2024.01.00, the earliest supported version, which may not match the behavior documented here.

        An unrecognized well-formed version uses the latest supported version that is not newer than the requested version, when one exists.

        For example, `v2026.08.00` uses `v2026.07.00`.

        A malformed value, such as `2022`, returns a `404` response.'
      schema:
        type: string
        enum:
        - v2026.01.00
        example: v2026.01.00
        x-speakeasy-ignore: true
      x-speakeasy-ignore: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
externalDocs:
