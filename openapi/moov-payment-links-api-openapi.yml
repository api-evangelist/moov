components:
  schemas:
    Count:
      type: integer
      format: int64
      description: Limits the maximum number of results returned, or determines the page size when used with `skip` or `cursor` for pagination.
      example: 20
    CreatePaymentLinkLineItem:
      type: object
      required:
      - name
      - basePrice
      - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: The name of the item.
        basePrice:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: The base price of the item before applying option modifiers.
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The quantity of this item.
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreatePaymentLinkLineItemOption'
          description: Optional list of modifiers applied to this item (e.g., toppings, upgrades, customizations).
        imageIDs:
          type: array
          items:
            $ref: '#/components/schemas/ImageID'
          description: "  Optional list of images associated with this line item.\n  This field is being deprecated in favor using the images associated with a productID and will soon be unsupported."
          deprecated: true
        productID:
          type: string
          description: "  Optional unique identifier associating the line item with a product.\n  When provided, images associated with the product will be included on the line item.\n  This does not populate other details of the line item."
      description: Represents a single line item in a payment link, including optional modifiers and quantity.
    PhoneNumberError:
      type: object
      properties:
        number:
          type: string
        countryCode:
          type: string
    CreatePaymentLinkLineItemsValidationError:
      type: object
      properties:
        items:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CreatePaymentLinkLineItemValidationError'
    Currency:
      type: string
      pattern: ^[A-Za-z]{3}$
      description: A 3-letter ISO 4217 currency code.
      example: USD
    DisplayOptionsError:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        callToAction:
          type: string
    PaymentLinkLineItems:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLinkLineItem'
          minItems: 1
          description: The list of line items.
      description: 'An optional collection of line items for a payment link.

        When line items are provided, their total plus tax must equal the payment link amount.'
    CreatePaymentLinkLineItemValidationError:
      type: object
      properties:
        productID:
          type: string
        name:
          type: string
        basePrice:
          $ref: '#/components/schemas/AmountDecimalValidationError'
        options:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CreatePaymentLinkLineItemOptionValidationError'
        quantity:
          type: string
    AmountDecimalValidationError:
      type: object
      properties:
        currency:
          type: string
        valueDecimal:
          type: string
    PhoneNumber:
      type: object
      properties:
        number:
          type: string
          maxLength: 10
          example: '8185551212'
        countryCode:
          type: string
          maxLength: 1
          example: '1'
    PaymentLinkType:
      type: string
      enum:
      - payment
      - payout
      - invoice-payment
    PaymentLinkPaymentDetailsUpdate:
      type: object
      properties:
        allowedMethods:
          type: array
          items:
            $ref: '#/components/schemas/CollectionPaymentMethodType'
          minItems: 1
          description: A list of payment methods that should be supported for this payment link.
        cardDetails:
          $ref: '#/components/schemas/CardPaymentDetails'
        achDetails:
          $ref: '#/components/schemas/ACHPaymentDetails'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional free-form metadata for the transfer.
      description: Options for payment links used to collect payment.
    PaymentLinkCode:
      type: string
      description: Unique code identifying this payment link.
      example: uc7ZYKrMhi
    Email:
      type: string
      maxLength: 255
      format: email
      example: jordan.lee@classbooker.dev
    AmountValidationError:
      type: object
      properties:
        currency:
          type: string
        value:
          type: string
    CreatePaymentLinkError:
      type: object
      properties:
        partnerAccountID:
          type: string
        merchantPaymentMethodID:
          type: string
        amount:
          $ref: '#/components/schemas/AmountValidationError'
        salesTaxAmount:
          $ref: '#/components/schemas/AmountValidationError'
        maxUses:
          type: string
        expiresOn:
          type: string
        display:
          $ref: '#/components/schemas/DisplayOptionsError'
        payment:
          $ref: '#/components/schemas/PaymentDetailsError'
        payout:
          $ref: '#/components/schemas/PayoutDetailsError'
        lineItems:
          $ref: '#/components/schemas/CreatePaymentLinkLineItemsValidationError'
    PaymentLinkCustomerOptions:
      type: object
      properties:
        requireAddress:
          type: boolean
          description: If true, a billing address is required when completing the payment form.
        requirePhone:
          type: boolean
          description: If true, a phone number is required when completing the payment form.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional free-form metadata for the Moov account that will represent this customer.
    ACHPaymentDetailsError:
      type: object
      properties:
        companyEntryDescription:
          type: string
        originatingCompanyName:
          type: string
    PaymentLinkPaymentDetails:
      type: object
      required:
      - allowedMethods
      properties:
        allowedMethods:
          type: array
          items:
            $ref: '#/components/schemas/CollectionPaymentMethodType'
          minItems: 1
          description: A list of payment methods that should be supported for this payment link.
        cardDetails:
          $ref: '#/components/schemas/CardPaymentDetails'
        achDetails:
          $ref: '#/components/schemas/ACHPaymentDetails'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional free-form metadata for the transfer.
      description: Options for payment links used to collect payment.
    PaymentDetailsError:
      type: object
      properties:
        allowedMethods:
          type: string
        cardDetails:
          $ref: '#/components/schemas/CardPaymentDetailsError'
        achDetails:
          $ref: '#/components/schemas/ACHPaymentDetailsError'
        metadata:
          type: string
    ACHPaymentDetails:
      type: object
      properties:
        companyEntryDescription:
          $ref: '#/components/schemas/ACHCompanyEntryDescription'
        originatingCompanyName:
          $ref: '#/components/schemas/ACHOriginatingCompanyName'
      description: Options for payment links used to collect an ACH payment.
    PayoutDetailsError:
      type: object
      properties:
        allowedMethods:
          type: string
        recipient:
          $ref: '#/components/schemas/PayoutRecipientError'
        metadata:
          type: string
    PaymentLinkDisplayOptionsUpdate:
      type: object
      properties:
        title:
          type: string
          description: The payment page title displayed to the user.
        description:
          type: string
          description: A payment description displayed to the user.
        callToAction:
          $ref: '#/components/schemas/CallToAction'
      description: Customizable display options for a payment link.
    ACHOriginatingCompanyName:
      type: string
      minLength: 4
      maxLength: 16
      description: An optional override of the default NACHA company name for a transfer.
      example: Whole Body Fit
    PaymentLinkLineItemImageMetadata:
      type: object
      required:
      - imageID
      - link
      - publicID
      properties:
        imageID:
          $ref: '#/components/schemas/ImageID'
        altText:
          type: string
          maxLength: 125
          description: Alternative text for the image.
        link:
          type: string
          format: uri
          description: The image's public URL.
          example: https://api.moov.io/images/q7lKWleAy9fUNhEGezQ1g
        publicID:
          $ref: '#/components/schemas/ImagePublicID'
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    PaymentLinkLineItemOption:
      type: object
      required:
      - name
      - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: The name of the option or modifier.
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The quantity of this option.
        priceModifier:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: Optional price modification applied by this option. Can be positive, negative, or zero.
        images:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLinkLineItemImageMetadata'
          description: Optional list of images associated with this line item option.
        group:
          type: string
          maxLength: 100
          description: Optional group identifier to categorize related options (e.g., 'toppings').
      description: Represents a modifier or option applied to a line item.
    CreatePaymentLinkLineItemOptionValidationError:
      type: object
      properties:
        name:
          type: string
        group:
          type: string
        priceModifier:
          $ref: '#/components/schemas/AmountDecimalValidationError'
        quantity:
          type: string
    CreatePaymentLinkLineItemOption:
      type: object
      required:
      - name
      - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: The name of the option or modifier.
        quantity:
          type: integer
          format: int32
          minimum: 1
