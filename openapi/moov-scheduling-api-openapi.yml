components:
  schemas:
    Count:
      type: integer
      format: int64
      description: Limits the maximum number of results returned, or determines the page size when used with `skip` or `cursor` for pagination.
      example: 20
    Currency:
      type: string
      pattern: ^[A-Za-z]{3}$
      description: A 3-letter ISO 4217 currency code.
      example: USD
    ScheduledTransferLineItems:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledTransferLineItem'
          minItems: 1
          description: The list of line items.
      description: Line items for a scheduled transfer.
    ScheduleValidationError:
      type: object
      properties:
        occurrences:
          type: object
          additionalProperties:
            type: string
        recur:
          type: string
        description:
          type: string
    ScheduleResponse:
      type: object
      required:
      - destinationAccountID
      - mode
      - ownerAccountID
      - partnerAccountID
      - scheduleID
      - sourceAccountID
      - createdOn
      - updatedOn
      properties:
        description:
          type: string
          description: Simple description to place on the transfer.
        destinationAccountID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        mode:
          $ref: '#/components/schemas/Mode'
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/OccurrencesResponse'
        ownerAccountID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        partnerAccountID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        recur:
          $ref: '#/components/schemas/RecurResponse'
        scheduleID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        sourceAccountID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        disabledOn:
          type: string
          format: date-time
    ScheduledTransferLineItem:
      type: object
      required:
      - name
      - basePrice
      - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: The name of the item.
        basePrice:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: The base price of the item before applying option modifiers.
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The quantity of this item.
        options:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledTransferLineItemOption'
          description: Optional list of modifiers applied to this item (e.g., toppings, upgrades, customizations).
        productID:
          type: string
          description: Optional unique identifier associating the line item with a product.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledTransferImageMetadata'
          description: Optional list of images associated with this line item.
      description: Represents a single item in a scheduled transfer, including optional modifiers and quantity.
    CreateScheduledTransferLineItemOption:
      type: object
      required:
      - name
      - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: The name of the option or modifier.
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The quantity of this option.
        priceModifier:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: Optional price modification applied by this option. Can be positive, negative, or zero.
        group:
          type: string
          maxLength: 100
          description: Optional group identifier to categorize related options (e.g., 'toppings').
        imageIDs:
          type: array
          items:
            $ref: '#/components/schemas/ImageID'
          description: "  Optional list of images associated with this line item option.\n  This field is being deprecated in favor using the images associated with a productID and will soon be unsupported."
          deprecated: true
      description: Represents a modifier or option applied to a scheduled transfer line item.
    ACHOriginatingCompanyName:
      type: string
      minLength: 4
      maxLength: 16
      description: An optional override of the default NACHA company name for a transfer.
      example: Whole Body Fit
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    ImageID:
      type: string
      description: Unique identifier for a image resource.
    AmountDecimal:
      type: object
      required:
      - currency
      - valueDecimal
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        valueDecimal:
          type: string
          pattern: ^\d+\.\d{1,9}$
          description: "A decimal-formatted numerical string that represents up to 9 decimal place precision. \n\nFor example, $12.987654321 is '12.987654321'."
          example: '12.987654321'
    OccurrenceStatus:
      type: string
      enum:
      - pending
      - failed
      - completed
      description: Status of the completed occurrence.
    CreateScheduledTransferLineItems:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateScheduledTransferLineItem'
          minItems: 1
          description: The list of line items.
      description: 'An optional collection of line items for a scheduled transfer.

        When line items are provided their total must equal `amount` minus `salesTaxAmount`.'
    RecurResponse:
      type: object
      required:
      - recurrenceRule
      - runTransfer
      properties:
        recurrenceRule:
          type: string
          description: "  RRule as defined by RFC 5545 (https://www.rfc-editor.org/rfc/rfc5545#section-3.3.10).\n  Generators available online at the following sites - https://freetools.textmagic.com/rrule-generator, https://jkbrzt.github.io/rrule/"
        runTransfer:
          $ref: '#/components/schemas/RunTransfer'
        indefinite:
          type: boolean
          description: True if the RRule set runs indefinitely.
        start:
          type: string
          format: date-time
          example: '2009-11-10T23:00:00Z'
    PartialScheduleAccount:
      type: object
      required:
      - accountID
      - displayName
      properties:
        accountID:
          type: string
        displayName:
          type: string
        email:
          type: string
    Recur:
      type: object
      required:
      - recurrenceRule
      - runTransfer
      properties:
        recurrenceRule:
          type: string
          description: "  RRule as defined by RFC 5545 (https://www.rfc-editor.org/rfc/rfc5545#section-3.3.10). \n  Generators available online at the following sites - https://freetools.textmagic.com/rrule-generator, https://jkbrzt.github.io/rrule/"
        runTransfer:
          $ref: '#/components/schemas/CreateRunTransfer'
        indefinite:
          type: boolean
          description: True if the RRule set runs indefinitely.
        start:
          type: string
          format: date-time
          example: '2009-11-10T23:00:00Z'
      description: Defines configuration for recurring transfers.
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CardDynamicDescriptor:
      type: string
      minLength: 4
      maxLength: 22
      description: An optional override of the default card statement descriptor for a transfer. Accounts must be enabled by Moov to set this field.
      example: WhlBdy *Yoga 11-12
    ScheduleListResponse:
      type: object
      properties:
        sourceAccount:
          $ref: '#/components/schemas/PartialScheduleAccount'
        destinationAccount:
          $ref: '#/components/schemas/PartialScheduleAccount'
        partnerAccount:
          $ref: '#/components/schemas/PartialScheduleAccount'
      allOf:
      - $ref: '#/components/schemas/ScheduleResponse'
    ImagePublicID:
      type: string
      pattern: '[A-Za-z0-9_-]{21}'
      description: A unique identifier for an image, used in public image links.
    UpsertSchedule:
      type: object
      properties:
        description:
          type: string
          description: Simple description of what the schedule is.
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/Occurrence'
        recur:
          $ref: '#/components/schemas/Recur'
    SchedulePaymentMethod:
      type: object
      required:
      - paymentMethodID
      properties:
        paymentMethodID:
          type: string
          example: c520f1b9-0ba7-42f5-b977-248cdbe41c69
        achDetails:
          type: object
