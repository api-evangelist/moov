        schema:
          type: string
      - name: scheduleID
        in: path
        required: true
        schema:
          type: string
      - name: occurrenceFilter
        in: path
        required: true
        description: "  Allows the specification of additional filters beyond the string.\n\n  Specifying a string returns the exact occurrence.\n  Specifying a RFC 3339 timestamp returns the latest occurrence at or before that timestamp.\n  Specifying `latest` returns the latest occurrence at or before now."
        schema:
          type: string
      responses:
