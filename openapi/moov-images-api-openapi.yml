components:
  schemas:
    ImageRequestValidationError:
      type: object
      properties:
        image:
          type: string
        metadata:
          $ref: '#/components/schemas/ImageMetadataValidationError'
    ImageMetadataValidationError:
      type: object
      properties:
        altText:
          type: string
    ImageListCount:
      type: integer
      format: int64
      maximum: 200
      description: Page size for image list requests. When omitted, the server defaults to `20`.
      example: 20
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    ImageMetadataRequest:
      type: object
      properties:
        altText:
          type: string
          maxLength: 125
          description: Alternative text for the image.
      description: Request body for creating or updating image metadata.
    ImageUploadRequestMultiPart:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: A PNG, JPEG, or WebP image file to upload.
        metadata:
          allOf:
          - $ref: '#/components/schemas/ImageMetadataRequest'
          description: Optional, json-encoded metadata to associate with the uploaded image.
      required:
      - image
    ImageID:
      type: string
      description: Unique identifier for a image resource.
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    ImageMetadata:
      type: object
      required:
      - imageID
      - publicID
      - link
      - createdOn
      - updatedOn
      properties:
        imageID:
          $ref: '#/components/schemas/ImageID'
        publicID:
          allOf:
          - $ref: '#/components/schemas/ImagePublicID'
          description: The ID used to get an image with the public endpoint.
        altText:
          type: string
          maxLength: 125
          description: Alternative text for the image.
        link:
          type: string
          format: uri
          description: "A public URL to access the image. An optional `size={width}x{height}` \nquery parameter can be provided to resize the image."
          example: https://api.moov.io/images/qJRAaAwwF5hmfeAFdHjIb
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        disabledOn:
          type: string
          format: date-time
      description: Metadata about an uploaded image.
    ImagePublicID:
      type: string
      pattern: '[A-Za-z0-9_-]{21}'
      description: A unique identifier for an image, used in public image links.
