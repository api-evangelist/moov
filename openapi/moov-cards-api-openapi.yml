      description: Production API host
      variables: {}
components:
  schemas:
    UpdateCardExpiration:
      type: object
      properties:
        month:
          type: string
          description: Two-digit month the card expires.
        year:
          type: string
          description: Two-digit year the card expires.
      example:
        month: '01'
        year: '21'
    JSONWebEncryptionToken:
      type: string
      format: jwe
      description: An [RFC](https://datatracker.ietf.org/doc/html/rfc7516) compact-serialized JSON Web Encryption (JWE) token.
    BasicPaymentMethod:
      type: object
      required:
      - paymentMethodID
      - paymentMethodType
      properties:
        paymentMethodID:
          $ref: '#/components/schemas/PaymentMethodID'
        paymentMethodType:
          $ref: '#/components/schemas/PaymentMethodType'
    CardExpiration:
      type: object
      required:
      - month
      - year
      properties:
        month:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-digit month the card expires.
        year:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-digit year the card expires.
      description: The expiration date of the card or token.
      example:
        month: '01'
        year: '21'
    PaymentMethodType:
      type: string
      enum:
      - moov-wallet
      - ach-debit-fund
      - ach-debit-collect
      - ach-credit-standard
      - ach-credit-same-day
      - rtp-credit
      - card-payment
      - push-to-card
      - pull-from-card
      - apple-pay
      - card-present-payment
      - instant-bank-credit
      description: The payment method type that represents a payment rail and directionality
    DomesticPullFromCard:
      type: string
      enum:
      - not-supported
      - supported
      - unknown
      description: Indicates if the card supports domestic pull-from-card transfer.
      example: supported
    CardID:
      type: string
      description: ID of the card.
      example: 01234567-89ab-cdef-0123-456789abcdef
    Card:
      type: object
      required:
      - cardID
      - fingerprint
      - brand
      - cardType
      - lastFourCardNumber
      - bin
      - expiration
      - billingAddress
      - cardVerification
      properties:
        cardID:
          $ref: '#/components/schemas/CardID'
        fingerprint:
          $ref: '#/components/schemas/CardFingerprint'
        brand:
          $ref: '#/components/schemas/CardBrand'
        cardType:
          $ref: '#/components/schemas/CardType'
        cardCategory:
          type: string
          description: 'The category or level of the card defined by the issuer.

            Examples include, but not limited to, "REWARDS", "TRADITIONAL REWARDS", "CLASSIC", and "CORPORATE PURCHASING".'
        lastFourCardNumber:
          type: string
          minLength: 4
          maxLength: 4
          description: Last four digits of the card number
        bin:
          type: string
          minLength: 6
          maxLength: 8
          description: The first six to eight digits of the card number, which identifies the financial institution that issued the card.
        expiration:
          $ref: '#/components/schemas/CardExpiration'
        holderName:
          type: string
          description: The name of the cardholder as it appears on the card.
        billingAddress:
          allOf:
          - $ref: '#/components/schemas/CardAddress'
          description: The billing address associated with the card.
        cardVerification:
          $ref: '#/components/schemas/CardVerification'
        issuer:
          type: string
          description: Financial institution that issued the card.
        issuerCountry:
          type: string
          description: Country where the card was issued.
        issuerURL:
          type: string
          format: uri
          description: URL of the issuer.
        issuerPhone:
          type: string
          description: Phone number of the issuer.
        commercial:
          type: boolean
          description: 'If true, the card is for commercial use, or associated with a business.

            If false, the card is associated with a general consumer.'
        regulated:
          type: boolean
          description: 'If true, the card issuing bank is regulated, and the scheme fees for debit transactions will be limited based on the Durbin Amendment.

            If false, the card issuing bank is not regulated, and the scheme fees will not be limited.'
        cardOnFile:
          type: boolean
          description: Indicates cardholder has authorized card to be stored for future payments.
        merchantAccountID:
          type: string
          description: 'Merchant account whose details (statement descriptor, address, etc.) are used for the card verification authorization.

            If omitted, the partner account''s details are used instead.'
        cardAccountUpdater:
          $ref: '#/components/schemas/CardAccountUpdater'
        domesticPushToCard:
          $ref: '#/components/schemas/DomesticPushToCard'
        domesticPullFromCard:
          $ref: '#/components/schemas/DomesticPullFromCard'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/BasicPaymentMethod'
          description: "  Includes any payment methods created as a result of linking a card with the `x-wait-for` header set to `payment-method`.\n\n  Only returned by the link card endpoint; not included when getting or listing cards."
      description: Describes a card on a Moov account.
      example:
        cardID: 01234567-89ab-cdef-0123-456789abcdef
        fingerprint: 9948962d92a1ce40c9f918cd9ece3a22bde62fb325a2f1fe2e833969de672ba3
        brand: Visa
        cardType: credit
        cardCategory: CLASSIC
        lastFourCardNumber: '1111'
        bin: '411111'
        expiration:
          month: '01'
          year: '21'
        holderName: Jules Jackson
        billingAddress:
          addressLine1: 123 Main Street
          addressLine2: Apt 302
          city: Boulder
          stateOrProvince: CO
          postalCode: '80301'
          country: US
        cardVerification:
          cvv: match
          addressLine1: match
          postalCode: match
          accountName:
            firstName: match
            lastName: match
            middleName: match
            fullName: match
        issuer: GRINGOTTS BANK
        issuerCountry: US
        issuerURL: HTTPS://WWW.EXAMPLE.COM/
        issuerPhone: '8185551212'
        commercial: false
        regulated: false
        cardOnFile: true
        merchantAccountID: 01234567-89ab-cdef-0123-456789abcdef
        cardAccountUpdater:
          updatedOn: '2024-05-06T12:20:38.184Z'
          updateType: number-update
        domesticPushToCard: standard
        domesticPullFromCard: supported
    CardAccountUpdater:
      type: object
      properties:
        updatedOn:
          type: string
          format: date-time
          description: Timestamp from the card network indicating when the card update was processed.
        updateType:
          $ref: '#/components/schemas/CardUpdateReason'
      description: The results of the most recent card update request.
      example:
        updatedOn: '2024-05-06T12:20:38.184Z'
        updateType: number-update
    UpdateCardAddress:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 60
          description: Street address line 1.
        addressLine2:
          type: string
          maxLength: 32
          description: Street address line 2 (e.g., apartment or suite number).
        city:
          type: string
          maxLength: 32
          description: City name.
        stateOrProvince:
          type: string
          maxLength: 2
          description: Two-letter state or province code.
        postalCode:
          type: string
          maxLength: 10
          description: Postal or ZIP code.
        country:
          type: string
          maxLength: 2
          description: Two-letter ISO 3166-1 country code.
      example:
        addressLine1: 123 Main Street
        addressLine2: Apt 302
        city: Boulder
        stateOrProvince: CO
        postalCode: '80301'
        country: US
    CardVerificationResult:
      type: string
      enum:
      - noMatch
      - match
      - notChecked
      - unavailable
      - partialMatch
      description: The result of a card verification check.
      example: match
    CardAddress:
      type: object
      required:
      - postalCode
      properties:
        addressLine1:
          type: string
          maxLength: 60
          description: Street address line 1.
        addressLine2:
          type: string
          maxLength: 32
          description: Street address line 2 (e.g., apartment or suite number).
        city:
          type: string
          maxLength: 32
