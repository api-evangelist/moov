openapi: 3.2.0
info:
  title: Moov Cards API
  version: '1.0'
  description: 'Operations tagged Cards across 3 of this provider''s published API definitions: moov-api-v2026.01.00-openapi.yml, moov-openapi.yml, moov-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moov.io
  description: Production API host
  variables: {}
tags:
- name: Cards
paths:
  /accounts/{accountID}/cards:
    post:
      operationId: linkCard
      description: 'Link a card to an existing Moov account.


        Read our accept card payments guide to learn more.


        Only use this endpoint if you have provided Moov with a copy of your PCI attestation of compliance.


        During card linking, the provided data will be verified by submitting a $0 authorization (account verification) request.

        If `merchantAccountID` is provided, the authorization request will contain that account''s statement descriptor and address.

        Otherwise, the platform account''s profile will be used. If no statement descriptor has been set, the authorization will

        use the account''s name instead.


        It is strongly recommended that callers include the `X-Wait-For` header, set to `payment-method`, if the newly linked

        card is intended to be used right away. If this header is not included, the caller will need to poll the List Payment

        Methods

        endpoint to wait for the new payment methods to be available for use.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: x-wait-for
        in: header
        required: false
        description: "Optional header to wait for certain events, such as the creation of a payment method, to occur before returning a response.\n\nWhen this header is set to `payment-method`, the response will include any payment methods that were created for the newly \nlinked card in the `paymentMethods` field. Otherwise, the `paymentMethods` field will be omitted from the response."
        schema:
          $ref: '#/components/schemas/LinkCardWaitFor'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              example:
                cardID: 01234567-89ab-cdef-0123-456789abcdef
                fingerprint: 9948962d92a1ce40c9f918cd9ece3a22bde62fb325a2f1fe2e833969de672ba3
                brand: Visa
                cardType: credit
                cardCategory: CLASSIC
                lastFourCardNumber: '1111'
                bin: '411111'
                expiration:
                  month: '01'
                  year: '21'
                holderName: Jules Jackson
                billingAddress:
                  addressLine1: 123 Main Street
                  addressLine2: Apt 302
                  city: Boulder
                  stateOrProvince: CO
                  postalCode: '80301'
                  country: US
                cardVerification:
                  cvv: match
                  addressLine1: match
                  postalCode: match
                  accountName:
                    firstName: match
                    lastName: match
                    middleName: match
                    fullName: match
                issuer: GRINGOTTS BANK
                issuerCountry: US
                issuerURL: HTTPS://WWW.EXAMPLE.COM/
                issuerPhone: '8185551212'
                commercial: false
                regulated: false
                cardOnFile: true
                merchantAccountID: 01234567-89ab-cdef-0123-456789abcdef
                cardAccountUpdater:
                  updatedOn: '2024-05-06T12:20:38.184Z'
                  updateType: number-update
                domesticPushToCard: standard
                domesticPullFromCard: supported
                paymentMethods:
                - paymentMethodID: 01234567-89ab-cdef-0123-456789abcdef
                  paymentMethodType: card-payment
                - paymentMethodID: 01234567-89ab-cdef-0123-456789abcdef
                  paymentMethodType: push-to-card
                - paymentMethodID: 01234567-89ab-cdef-0123-456789abcdef
                  paymentMethodType: pull-from-card
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '409':
          description: Attempted to link card that already exists on the account.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCardError'
        '422':
          description: The request was well-formed, but the contents failed validation. Check the request for missing or invalid fields.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCardError'
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCard'
            example:
              cardNumber: '4111111111111111'
              cardCvv: '123'
              expiration:
                month: '01'
                year: '21'
              holderName: Jules Jackson
              billingAddress:
                postalCode: '80301'
      x-speakeasy-name-override: link
      security:
      - BasicAuth: []
      summary: Link card
      x-summary-source: derived
    get:
      operationId: listCards
      description: 'List all the active cards associated with a Moov account.


        Read our accept card payments guide to learn more.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.read` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Cards
      x-speakeasy-name-override: list
      security:
      - BasicAuth: []
      summary: List cards
      x-summary-source: derived
    parameters:
    - $ref: '#/components/parameters/accountID'
    servers:
    - url: https://api.moov.io
      description: Production API host
      variables: {}
  /accounts/{accountID}/cards/{cardID}:
    get:
      operationId: getCard
      description: 'Fetch a specific card associated with a Moov account.


        Read our accept card payments guide to learn more.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.read` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      - name: cardID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CardID'
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Cards
      x-speakeasy-name-override: get
      security:
      - BasicAuth: []
      summary: Get card
      x-summary-source: derived
    patch:
      operationId: updateCard
      description: 'Update a linked card and/or resubmit it for verification.


        If a value is provided for CVV, a new verification ($0 authorization) will be submitted for the card. Updating the expiration

        date or

        address will update the information stored on file for the card but will not be verified.


        Read our accept card payments guide to learn

        more.


        Only use this endpoint if you have provided Moov with a copy of your PCI attestation of compliance.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      - name: cardID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CardID'
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '409':
          description: The request conflicted with the current state of the target resource.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '422':
          description: The request was well-formed, but the contents failed validation. Check the request for missing or invalid fields.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCardError'
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCard'
      x-speakeasy-name-override: update
      security:
      - BasicAuth: []
      summary: Update card
      x-summary-source: derived
    delete:
      operationId: disableCard
      description: 'Disables a card associated with a Moov account.


        To access this endpoint using an access token

        you''ll need to specify the `/accounts/{accountID}/cards.write` scope.'
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      - name: cardID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CardID'
      responses:
        '204':
          description: The request completed successfully, but there is no content to return.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
