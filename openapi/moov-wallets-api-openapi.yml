components:
  schemas:
    Count:
      type: integer
      format: int64
      description: Limits the maximum number of results returned, or determines the page size when used with `skip` or `cursor` for pagination.
      example: 20
    Currency:
      type: string
      pattern: ^[A-Za-z]{3}$
      description: A 3-letter ISO 4217 currency code.
      example: USD
    PatchWallet:
      type: object
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/WalletStatus'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
      example:
        name: My second wallet
        description: My new description
        metadata:
          optional: metadata
    Wallet:
      type: object
      required:
      - walletID
      - availableBalance
      - partnerAccountID
      - name
      - status
      - walletType
      - description
      - createdOn
      properties:
        walletID:
          $ref: '#/components/schemas/WalletID'
        availableBalance:
          $ref: '#/components/schemas/WalletAvailableBalance'
        partnerAccountID:
          type: string
        name:
          type: string
          description: Name of the wallet
        status:
          $ref: '#/components/schemas/WalletStatus'
        walletType:
          $ref: '#/components/schemas/WalletType'
        description:
          type: string
          description: Description of the wallet
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdOn:
          type: string
          format: date-time
        closedOn:
          type: string
          format: date-time
      description: A Moov wallet to store funds for transfers.
    WalletAvailableBalance:
      type: object
      required:
      - currency
      - value
      - valueDecimal
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        value:
          type: integer
          format: int64
          description: "Quantity in the smallest unit of the specified currency. \n\nIn USD this is cents, for example, $12.04 is 1204 and $0.99 is 99."
          example: 1204
        valueDecimal:
          type: string
          pattern: ^\d+\.\d{1,9}$
    Metadata:
      type: object
      additionalProperties:
        type: string
      description: Free-form key-value pair list. Useful for storing information that is not captured elsewhere.
      example:
        optional: metadata
    WalletID:
      type: string
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    CreateWalletValidationError:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        metadata:
          type: string
    WalletType:
      type: string
      enum:
      - default
      - general
      - card-issuing
      description: "Type of a wallet.\n  - `default`: The system-generated wallet automatically created when an account is granted the wallet capability.\n  - `general`: An additional, user-defined wallet created via API or Dashboard.\n  - `card-issuing`: The system-generated wallet automatically created when an account is granted the card-issuing capability."
    PatchWalletValidationError:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        description:
          type: string
        metadata:
          type: string
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    WalletStatus:
      type: string
      enum:
      - active
      - closed
      description: "Status of a wallet.\n  - `active`: The wallet is available for use and has an enabled payment method.\n  - `closed`: The wallet is no longer active and the corresponding payment method has been disabled."
    ListWalletsValidationError:
      type: object
      properties:
        status:
          type: string
        walletType:
          type: string
        skip:
          type: string
        count:
          type: string
    CreateWallet:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the wallet.
        description:
          type: string
          description: Description of the wallet.
        metadata:
