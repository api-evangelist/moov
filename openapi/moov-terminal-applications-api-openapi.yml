components:
  schemas:
    TerminalApplicationID:
      type: string
      description: ID of the terminal application.
      example: 12345678-1234-1234-1234-123456789012
    TerminalApplicationStatus:
      type: string
      enum:
      - undefined
      - pending
      - enabled
      - disabled
      description: Status of the terminal application.
      example: enabled
    TerminalApplicationError:
      type: object
      properties:
        platform:
          type: string
        appBundleID:
          type: string
        packageName:
          type: string
        sha256Digest:
          type: string
        versionCode:
          type: string
    TerminalApplicationPlatform:
      type: string
      enum:
      - undefined
      - ios
      - android
      description: Platform of the terminal application.
      example: ios
    TerminalApplication:
      type: object
      required:
      - terminalApplicationID
      - status
      - platform
      properties:
        terminalApplicationID:
          $ref: '#/components/schemas/TerminalApplicationID'
        status:
          $ref: '#/components/schemas/TerminalApplicationStatus'
        platform:
          $ref: '#/components/schemas/TerminalApplicationPlatform'
        appBundleID:
          type: string
          description: The app bundle identifier of the terminal application. Will be returned if platform is `ios`.
        packageName:
          type: string
          pattern: ^[a-z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$
          description: The app package name of the terminal application. Will be returned if platform is `android`.
        sha256Digest:
          type: string
          description: A cryptographic hash of the signing key for the application. Will be returned if platform is `android`.
        versionCode:
          type: string
          description: The app version code of the terminal application. Will be returned if platform is `android`.
      description: Describes a terminal application.
      example:
        terminalApplicationID: 12345678-1234-1234-1234-123456789012
        status: pending
        platform: android
        packageName: com.example.app
        sha256Digest: AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD
        versionCode: '20332277'
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CreateTerminalApplication:
      type: object
      required:
      - platform
      properties:
        platform:
          $ref: '#/components/schemas/TerminalApplicationPlatform'
        appBundleID:
          type: string
          description: The app bundle identifier of the terminal application. Required if platform is `ios`.
        packageName:
          type: string
          description: The app package name of the terminal application. Required if platform is `android`.
        sha256Digest:
          type: string
          description: The SHA-256 digest of the signing key for the application. Required if platform is `android`.
        versionCode:
          type: string
          description: The version code of the Android application. Required if platform is `android`.
      description: Describes a create terminal application request.
      example:
        platform: android
        packageName: com.example.app
        sha256Digest: AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD:EE:FF:AA:BB:CC:DD
        versionCode: '20332277'
    TerminalApplicationVersion:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          description: The app version of the terminal application (version code for Android terminal application).
      description: Describes a terminal application version.
      example:
        version: '20440059'
  parameters:
    VersionHeader:
      name: X-Moov-Version
      in: header
      required: false
      description: 'Set this header to v2026.01.00 to use the API described in this specification.

        When omitted, the server defaults to v2024.01.00, the earliest supported version, which may not match the behavior documented here.

        An unrecognized well-formed version uses the latest supported version that is not newer than the requested version, when one exists.

        For example, `v2026.08.00` uses `v2026.07.00`.

        A malformed value, such as `2022`, returns a `404` response.'
      schema:
        type: string
        enum:
        - v2026.01.00
        example: v2026.01.00
        x-speakeasy-ignore: true
      x-speakeasy-ignore: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
