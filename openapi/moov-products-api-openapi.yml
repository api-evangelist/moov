              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              title: World's best lemonade
              description: Really, the best.
              basePrice:
                valueDecimal: '4.99'
                currency: USD
              images:
              - imageID: fed91252-6f48-4b70-885e-520bf53a52ff
              - imageID: eb466644-0a58-4b87-af1e-94d03e223ad2
