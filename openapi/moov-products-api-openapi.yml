openapi: 3.2.0
info:
  title: Moov Products API
  version: v2026.01.00
  contact:
    name: Moov Developer Support
    email: help@moov.io
    url: https://moov.io
  license:
    name: Unlicensed
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: 'Operations tagged Products across 2 of this provider''s published API definitions: moov-api-v2026.01.00-openapi.yml, moov-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moov.io
  description: Production API host
  variables: {}
security:
- BasicAuth: []
tags:
- name: Products
paths:
  /accounts/{accountID}/products:
    get:
      operationId: listProducts
      description: List active (non-disabled) products for an account.
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      - name: title
        in: query
        required: false
        description: Allows filtering products by title. This supports partial matches and is case-insensitive
        schema:
          type: string
        explode: false
      - $ref: '#/components/parameters/Pagination.skip'
      - $ref: '#/components/parameters/Pagination.count'
      responses:
        '200':
          description: The request completed successfully.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: The request contained missing or expired authentication.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '403':
          description: The user is not authorized to make the request.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '429':
          description: Request was refused due to rate limiting.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '500':
          description: The request failed due to an unexpected error.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
        '504':
          description: The request failed because a downstream service failed to respond.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
      tags:
      - Products
      x-speakeasy-name-override: list
      summary: List products
      x-summary-source: derived
    post:
      operationId: createProduct
      description: Creates a new product for the specified account.
      parameters:
      - $ref: '#/components/parameters/VersionHeader'
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The resource was successfully created.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                title: World's best lemonade
                description: Really, the best.
                basePrice:
                  valueDecimal: '4.99'
                  currency: USD
                images:
                - imageID: fed91252-6f48-4b70-885e-520bf53a52ff
                  altText: A refreshing glass of lemonade
                  link: https://api.moov.io/product-images/k9FzFqsMaot1IPzufEvE0
                  publicID: q7lKWleAy9fUNhEGezQ1g
                - imageID: eb466644-0a58-4b87-af1e-94d03e223ad2
                  altText: Lemonade with strawberries
                  link: https://api.moov.io/product-images/2pMcLHOeDbg85aVaRdqi9
                  publicID: 2pMcLHOeDbg85aVaRdqi9
                optionGroups:
                - name: Flavor add-ins
                  description: Choose up to 3 flavor add-ins to enhance your lemonade.
                  minSelect: 0
                  maxSelect: 3
                  options:
                  - name: Strawberry puree
                    description: Fresh and fruity.
                    priceModifier:
                      valueDecimal: '0.99'
                      currency: USD
                    images:
                    - imageID: d359808d-9896-4414-8d17-dac43f35842d
                      link: https://api.moov.io/product-images/BGjP7ho9WgICuSQT0HA9Z
                      publicID: BGjP7ho9WgICuSQT0HA9Z
                  - name: Passionfruit syrup
                    priceModifier:
                      valueDecimal: '0.49'
                      currency: USD
                  - name: Cherry syrup
                    priceModifier:
                      valueDecimal: '0.49'
                      currency: USD
                - name: Sweetener
                  description: Choose a sweetener for your lemonade.
                  minSelect: 1
                  maxSelect: 1
                  options:
                  - name: Cane Sugar
                  - name: Honey
                    priceModifier:
                      valueDecimal: '0.99'
                      currency: USD
                  - name: Stevia
                    description: Natural, zero-calorie sweetener.
                createdOn: '2025-09-01T00:00:00Z'
                updatedOn: '2025-09-02T00:00:00Z'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            x-request-id:
              required: true
              description: A unique identifier used to trace requests.
              schema:
                type: string
          content:
