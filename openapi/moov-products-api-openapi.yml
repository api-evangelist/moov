components:
  schemas:
    Count:
      type: integer
      format: int64
      description: Limits the maximum number of results returned, or determines the page size when used with `skip` or `cursor` for pagination.
      example: 20
    ProductID:
      type: string
      description: Unique identifier for a product.
    AssignProductImage:
      type: object
      required:
      - imageID
      properties:
        imageID:
          $ref: '#/components/schemas/ProductImageID'
    Currency:
      type: string
      pattern: ^[A-Za-z]{3}$
      description: A 3-letter ISO 4217 currency code.
      example: USD
    ProductOption:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The display name of a product option.
        description:
          type: string
          maxLength: 500
          description: 'A detailed description of the option.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        priceModifier:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: The adjustment applied to a product's base price by this option. Can be negative, positive, or zero.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageMetadata'
          maxItems: 20
          description: The images associated with this option.
      description: Represents a single product option within a group.
    AmountDecimalValidationError:
      type: object
      properties:
        currency:
          type: string
        valueDecimal:
          type: string
    AssignProductImageValidationError:
      type: object
      properties:
        imageID:
          type: string
    Product:
      type: object
      required:
      - productID
      - title
      - basePrice
      - createdOn
      - updatedOn
      properties:
        productID:
          $ref: '#/components/schemas/ProductID'
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 5000
          description: 'A detailed description of the product.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        basePrice:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: A product's starting price, before applying modifiers.
        optionGroups:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionGroup'
          description: Optional configuration options for a product, such as size or color.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageMetadata'
          maxItems: 20
          description: Optional images associated with the product.
        createdOn:
          type: string
          format: date-time
          description: The date and time when the product was added.
        updatedOn:
          type: string
          format: date-time
          description: The date and time when the product was last updated.
        disabledOn:
          type: string
          format: date-time
          description: The date and time when the product was disabled.
      description: A good or service offered by a merchant.
    AssignProductImages:
      type: array
      items:
        $ref: '#/components/schemas/AssignProductImage'
      description: Assign previously uploaded images to a product or option.
    ProductOptionGroup:
      type: object
      required:
      - name
      - minSelect
      - maxSelect
      - options
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
          description: 'A detailed description of the option group.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        minSelect:
          type: integer
          format: int32
          description: 'The minimum number of options that must be selected from this group.


            A value of 0 indicates that no selection from this group is required.'
        maxSelect:
          type: integer
          format: int32
          minimum: 1
          description: The maximum number of options that can be selected from this group.
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
          description: The options available within this group.
      description: Represents a group of product configuration options, such as size or color.
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    ProductOptionValidationError:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceModifier:
          $ref: '#/components/schemas/AmountDecimalValidationError'
        images:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AssignProductImageValidationError'
    AssignProductImagesItem:
      type: array
      items:
        $ref: '#/components/schemas/AssignProductImage'
      description: Assign previously uploaded images to a product or option.
    AmountDecimal:
      type: object
      required:
      - currency
      - valueDecimal
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        valueDecimal:
          type: string
          pattern: ^\d+\.\d{1,9}$
          description: "A decimal-formatted numerical string that represents up to 9 decimal place precision. \n\nFor example, $12.987654321 is '12.987654321'."
          example: '12.987654321'
    CreateProductOptionGroup:
      type: object
      required:
      - name
      - minSelect
      - maxSelect
      - options
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
          description: 'A detailed description of the option group.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        minSelect:
          type: integer
          format: int32
          description: 'The minimum number of options that must be selected from this group.


            A value of 0 indicates that no selection from this group is required.'
        maxSelect:
          type: integer
          format: int32
          minimum: 1
          description: The maximum number of options that can be selected from this group.
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreateProductOption'
          description: The options available within this group.
    GenericError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CreateProductOption:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The display name of a product option.
        description:
          type: string
          maxLength: 500
          description: 'A detailed description of the option.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        priceModifier:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: The adjustment applied to a product's base price by this option. Can be negative, positive, or zero.
        images:
          $ref: '#/components/schemas/AssignProductImagesItem'
    ProductOptionGroupValidationError:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        minSelect:
          type: string
        maxSelect:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProductOptionValidationError'
    ProductImageMetadata:
      type: object
      required:
      - imageID
      - link
      - publicID
      properties:
        imageID:
          $ref: '#/components/schemas/ProductImageID'
        altText:
          type: string
          maxLength: 125
          description: Alternative text for the image.
        link:
          type: string
          format: uri
          description: The image's public URL.
          example: https://api.moov.io/images/q7lKWleAy9fUNhEGezQ1g
        publicID:
          type: string
          description: The public ID used to access the image.
          example: q7lKWleAy9fUNhEGezQ1g
    ProductImageID:
      type: string
      description: Unique identifier for a product or product option image resource.
    ProductRequest:
      type: object
      required:
      - title
      - basePrice
      properties:
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 5000
          description: 'A detailed description of the product.


            - Must be valid UTF-8 text

            - Supports Markdown for formatting

            - HTML is not permitted and will be rejected'
        basePrice:
          allOf:
          - $ref: '#/components/schemas/AmountDecimal'
          description: A product's starting price, before applying modifiers.
        images:
          $ref: '#/components/schemas/AssignProductImages'
        optionGroups:
          type: array
          items:
            $ref: '#/components/schemas/CreateProductOptionGroup'
          description: Optional configuration options for a product, such as size or color.
      description: Request to create or update a product.
