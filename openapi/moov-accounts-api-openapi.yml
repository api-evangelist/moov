          example: Reese
        lastName:
          type: string
          maxLength: 64
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
          description: The individual's family name.
          example: Lee
        suffix:
          type: string
          maxLength: 20
          pattern: '[À-ÖØ-öø-ÿ"''(),.0-9A-Za-z~ &!-]*'
