      explode: false
    VersionHeader:
      name: X-Moov-Version
      in: header
      required: false
      description: 'Set this header to v2026.01.00 to use the API described in this specification.

        When omitted, the server defaults to v2024.01.00, the earliest supported version, which may not match the behavior documented here.

        An unrecognized well-formed version uses the latest supported version that is not newer than the requested version, when one exists.

        For example, `v2026.08.00` uses `v2026.07.00`.

        A malformed value, such as `2022`, returns a `404` response.'
      schema:
        type: string
        enum:
        - v2026.01.00
        example: v2026.01.00
        x-speakeasy-ignore: true
      x-speakeasy-ignore: true
    ListIssuingAuthorizationsQuery.startDateTime:
      name: startDateTime
      in: query
      required: false
      description: Optional date-time which inclusively filters all authorizations created after this date-time.
      schema:
        type: string
        format: date-time
      explode: false
    ListIssuingTransactionsQuery.issuedCardID:
      name: issuedCardID
      in: query
      required: false
      description: Optional ID of the issued card to filter results.
      schema:
        type: string
      explode: false
    Pagination.count:
      name: count
      in: query
      required: false
      description: Page size. When omitted, the server defaults to `200`.
      schema:
        $ref: '#/components/schemas/Count'
      explode: false
    ListIssuingTransactionsQuery.merchantName:
      name: merchantName
      in: query
      required: false
      description: Optional case-insensitive substring match on the merchant name to filter results.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      explode: false
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
