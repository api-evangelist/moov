components:
  schemas:
    Count:
      type: integer
      format: int64
      description: Limits the maximum number of results returned, or determines the page size when used with `skip` or `cursor` for pagination.
      example: 20
    IssuingMerchantData:
      type: object
      required:
      - networkID
      - country
      - mcc
      properties:
        networkID:
          type: string
          description: External identifier used to identify the merchant with the card brand.
        name:
          type: string
          description: Name of the merchant.
          example: Whole Body Fitness
        city:
          type: string
          description: The merchant's location.
          example: San Francisco
        country:
          type: string
          description: Two-letter country code.
          example: US
        postalCode:
          type: string
          description: The merchant's five-digit postal code.
          example: '94107'
        state:
          type: string
          description: The merchant's two-letter state abbreviation.
          example: CA
        mcc:
          type: string
          description: The Merchant Category Code.
          example: '7298'
    IssuingAuthorizationStatus:
      type: string
      enum:
      - pending
      - declined
      - canceled
      - cleared
      - expired
      description: Status of a card issuing authorization.
    IssuingDeclineReason:
      type: string
      enum:
      - insufficient-funds
      - card-not-active
      - card-expiration
      - spend-cutoff-reached
      - outside-allowed-schedule
      - spend-limit-exceeded
      - merchant-category-not-supported
      - merchant-category-restricted
      - merchant-restricted
      - merchant-country-not-supported
      - unsupported-transaction
      - network-stand-in
      - declined-by-issuer
      - invalid-request
      - system-error
      description: 'The reason an authorization or authorization event was declined. Only present if the

        authorization or event has been declined.'
    CardIssuingNetwork:
      type: string
      enum:
      - discover
      - shazam
      - visa
      description: The name of the network a card transaction is routed through.
    Skip:
      type: integer
      format: int64
      description: The number of entries to skip when paginating a large result set.
      example: 60
    IssuedCardAuthorizationEventResult:
      type: string
      enum:
      - approved
      - declined
      - processed
      description: The result of an event.
    IssuedCardAuthorization:
      type: object
      required:
      - authorizationID
      - issuedCardID
      - fundingWalletID
      - network
      - authorizedAmount
      - status
      - merchantData
      - createdOn
      properties:
        authorizationID:
          type: string
        issuedCardID:
          type: string
        lastFourCardNumber:
          type: string
          minLength: 4
          maxLength: 4
          description: Last four digits of the card number. Omitted for authorizations recorded before this was captured.
        fundingWalletID:
          type: string
        network:
          $ref: '#/components/schemas/CardIssuingNetwork'
        authorizedAmount:
          $ref: '#/components/schemas/SignedDecimalString'
        status:
          $ref: '#/components/schemas/IssuingAuthorizationStatus'
        merchantData:
          $ref: '#/components/schemas/IssuingMerchantData'
        createdOn:
          type: string
          format: date-time
        cardTransactions:
          type: array
          items:
            type: string
          description: List of card transaction IDs associated with this authorization.
        declineReason:
          $ref: '#/components/schemas/IssuingDeclineReason'
    SignedDecimalString:
      type: string
      format: ^\d+\.\d{1,2}$
      description: A decimal-formatted numerical string that represents up to 2 decimal place precision. In USD for example, 12.34 is $12.34 and 0.99 is $0.99.
      example: '-14.89'
    IssuedCardEventType:
      type: string
      enum:
      - authorization
      - reversal
      - authorization-advice
      - authorization-expiration
      - authorization-incremental
      - clearing
      description: The type of event that occurred on the card.
    IssuedCardAuthorizationEvent:
      type: object
      required:
      - eventID
      - eventType
      - amount
      - result
      - createdOn
      properties:
        eventID:
          type: string
          description: The identifier for this event. Use the `eventType` field to determine what resource is identified by this ID (`authorization`, `reversal`, etc.).
        eventType:
          $ref: '#/components/schemas/IssuedCardEventType'
        amount:
          $ref: '#/components/schemas/SignedDecimalString'
        result:
          $ref: '#/components/schemas/IssuedCardAuthorizationEventResult'
        createdOn:
          type: string
          format: date-time
        declineReason:
          $ref: '#/components/schemas/IssuingDeclineReason'
    IssuedCardTransaction:
      type: object
      required:
      - cardTransactionID
      - issuedCardID
      - fundingWalletID
      - amount
      - authorizedOn
      - merchantData
      - createdOn
      properties:
        cardTransactionID:
          type: string
        issuedCardID:
          type: string
        lastFourCardNumber:
          type: string
          minLength: 4
          maxLength: 4
          description: Last four digits of the card number. Omitted for transactions recorded before this was captured.
        fundingWalletID:
          type: string
        amount:
          $ref: '#/components/schemas/SignedDecimalString'
        authorizationID:
          type: string
        authorizedOn:
          type: string
          format: date-time
        merchantData:
          $ref: '#/components/schemas/IssuingMerchantData'
        createdOn:
          type: string
          format: date-time
  parameters:
    Pagination.skip:
      name: skip
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Skip'
      explode: false
    ListIssuingAuthorizationsQuery.statuses:
