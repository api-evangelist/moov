specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Moov
providerId: moov
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Payments
  - Embedded Finance
  - BaaS
description: Moov pay-as-you-go with $500/month minimum. Per-transaction pricing.
sources:
  - https://moov.io/pricing
plans:
  - id: moov-card-acceptance
    name: Card Acceptance
    type: usage-based
    description: Interchange+ + 0.60% + $0.15 per transaction.
    entries:
      - label: Per transaction
        name: tx
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: IC++ + 0.60% + $0.15
        userMultiplied: false
      - label: International surcharge
        name: intl
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: +1.5%
        userMultiplied: false
    elements:
      - name: Online card + mobile wallets
      - name: Apple Pay / Google Pay
      - name: $500/mo minimum
  - id: moov-tap-to-pay
    name: Tap to Pay
    type: usage-based
    description: Interchange+ + 0.50% + $0.15.
    entries:
      - label: Per transaction
        name: tx
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: IC++ + 0.50% + $0.15
        userMultiplied: false
    elements:
      - name: Contactless on iPhone/Android
      - name: Multiple card networks
  - id: moov-instant-payments
    name: Instant Payments
    type: usage-based
    description: 0.95% per transaction (50¢ min, $5 cap).
    entries:
      - label: Per transaction
        name: tx
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: 0.95% (50¢ min, $5 cap)
        userMultiplied: false
    elements:
      - name: RTP credit to bank
      - name: Instant push to debit cards
  - id: moov-bank-transfers
    name: Bank Transfers (ACH)
    type: usage-based
    description: $0.25-$0.40 per ACH.
    entries:
      - label: Per ACH
        name: ach
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: 0.25-0.40
        userMultiplied: false
    elements:
      - name: Same-day and next-day ACH
      - name: Failed transaction handling
  - id: moov-wallets
    name: Moov Wallets
    type: subscription
    description: $0.50/month per active wallet.
    entries:
      - label: Per active wallet-month
        name: wallet
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.50'
        userMultiplied: true
    elements:
      - name: Fund storage and balance tracking
      - name: Automated payouts and transfers
  - id: moov-virtual-cards
    name: Virtual Cards
    type: usage-based
    description: $0.15 per card creation.
    entries:
      - label: Per card
        name: card
        type: metered
        metric: card
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.15'
        userMultiplied: false
    elements:
      - name: Visa commercial debit cards
      - name: Vendor payment processing
  - id: moov-custom
    name: Custom (High Volume)
    type: enterprise
    description: Custom pricing.
    entries:
      - label: Annual (custom)
        name: annual
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Volume discounts
